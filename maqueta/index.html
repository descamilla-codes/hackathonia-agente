<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maqueta del agente</title>
<style>
:root {
  --bg: #ffffff; --sheet: #ffffff; --ink: #16181a; --muted: #5d636a;
  --line: #dde1dc; --accent: #1f5fd6; --accent-soft: #e8f0fd; --tab: #e9ebe7;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121413; --sheet: #1b1e1c; --ink: #eceeec; --muted: #a2a8a4;
    --line: #2e332f; --accent: #5b8ff0; --accent-soft: #1a2640; --tab: #232725;
  }
}
:root[data-theme="dark"] {
  --bg: #121413; --sheet: #1b1e1c; --ink: #eceeec; --muted: #a2a8a4;
  --line: #2e332f; --accent: #5b8ff0; --accent-soft: #1a2640; --tab: #232725;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 16px/1.45 -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
  min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 24px 16px; }
header { width: 100%; max-width: 1440px; display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 16px; }
header b { font-size: 18px; }
header small { color: var(--muted); }

.layout { width: 100%; max-width: 1440px; display: flex; gap: 16px; align-items: stretch; }
.book { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.book .sheet { flex: 1; }
.chat { width: 340px; background: var(--sheet); border: 1px solid var(--line); border-radius: 14px;
  display: flex; flex-direction: column; max-height: 640px; }
.chat h2 { margin: 0; padding: 14px 16px; font-size: 15px; border-bottom: 1px solid var(--line); }
.chat h2 small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; }
.msgs { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
.msg { max-width: 85%; padding: 8px 12px; border-radius: 12px; font-size: 14px; }
.msg.bot { background: var(--tab); align-self: flex-start; border-bottom-left-radius: 4px; }
.msg.me { background: var(--accent); color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 14px 10px; }
.chip { font: inherit; font-size: 12px; color: var(--ink); background: var(--sheet); border: 1px solid var(--line);
  border-radius: 999px; padding: 4px 10px; cursor: pointer; }
.chip:hover { border-color: var(--accent); }
.ask { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--line); }
.ask input { flex: 1; min-width: 0; font: inherit; font-size: 14px; color: var(--ink); background: var(--bg);
  border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
.ask button { font: inherit; font-weight: 700; font-size: 14px; background: var(--accent); color: #fff;
  border: none; border-radius: 8px; padding: 8px 12px; cursor: pointer; }
@media (max-width: 1200px) {
  .layout { flex-direction: column; }
  .chat { width: 100%; max-height: 420px; }
}
.sheet { background: var(--sheet); border: 1px solid var(--line); border-bottom: none;
  border-radius: 14px 14px 0 0; padding: 32px; min-height: 440px; }
.sheet h1 { margin: 0 0 4px; font-size: 26px; line-height: 1.2; }
.meta { color: var(--accent); font-weight: 700; font-size: 14px; margin-bottom: 10px; }
.desc { color: var(--muted); max-width: 680px; margin: 0 0 12px;
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.quotes { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
.quotes span { background: var(--tab); border-radius: 999px; padding: 3px 12px; font-size: 13px; color: var(--muted); }

.work { display: flex; gap: 20px; align-items: stretch; }
.options { flex: 1; display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.actions { width: 150px; display: flex; flex-direction: column; justify-content: center; gap: 10px; }
.btn { font: inherit; font-weight: 700; border-radius: 10px; padding: 12px; cursor: pointer; }
.accept { background: var(--accent); color: #fff; border: 2px solid var(--accent); }
.accept:disabled { background: var(--line); border-color: var(--line); color: var(--muted); cursor: not-allowed; }
.skip { background: #fff; color: #16181a; border: 2px solid var(--line); }
.skip:hover { border-color: var(--muted); }
.opt { text-align: left; font: inherit; color: inherit; background: var(--sheet);
  border: 2px solid var(--line); border-radius: 12px; padding: 18px; cursor: pointer;
  display: flex; flex-direction: column; gap: 10px; transition: border-color .15s, transform .15s; }
.opt:hover { border-color: var(--accent); transform: translateY(-2px); }
.opt:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.opt[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.opt h3 { margin: 0; font-size: 17px; }
.opt .what, .opt .why { margin: 0; font-size: 14px;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.opt .why { color: var(--muted); }
.opt .why b { color: var(--ink); }
.badge { align-self: flex-start; background: var(--accent); color: #fff; font-size: 12px; font-weight: 700;
  border-radius: 6px; padding: 2px 8px; }
.badge.ghost { visibility: hidden; }

.tabs { display: flex; gap: 2px; overflow-x: auto; background: var(--tab);
  border: 1px solid var(--line); border-radius: 0 0 14px 14px; padding: 0 8px; }
.tab { font: inherit; font-size: 14px; color: var(--muted); background: transparent; border: none;
  padding: 10px 16px; cursor: pointer; white-space: nowrap; border-top: 3px solid transparent; }
.tab[aria-selected="true"] { background: var(--sheet); color: var(--ink); font-weight: 700; border-top-color: var(--accent); }
.tab .ok { color: var(--accent); margin-left: 6px; }
.tab .no { margin-left: 6px; }

.summary ol { padding-left: 20px; margin: 0 0 24px; }
.summary li { margin-bottom: 14px; }
.summary li small { display: block; color: var(--muted); }
.pending { color: #b5651d; }
.apply { font: inherit; font-weight: 700; background: var(--accent); color: #fff; border: none;
  border-radius: 10px; padding: 14px 22px; cursor: pointer; }
.apply:disabled { opacity: .45; cursor: not-allowed; }
.note { color: var(--muted); font-size: 13px; margin-top: 16px; }

@media (max-width: 960px) {
  .work { flex-direction: column; }
  .actions { width: 100%; flex-direction: row; justify-content: flex-end; }
  .actions .btn { width: 150px; }
}
@media (max-width: 720px) {
  .sheet { padding: 20px; }
  .work { flex-direction: column; }
  .options { grid-template-columns: 1fr; }
  .actions { width: 100%; }
}
</style>
</head>
<body>
<header>
  <b>Agente de voz del cliente</b>
  <small>Maqueta · datos de ejemplo, no reales</small>
</header>

<main class="layout">
<div class="book">
  <section class="sheet" id="sheet" aria-live="polite"></section>
  <nav class="tabs" id="tabs" role="tablist"></nav>
</div>
<aside class="chat" aria-label="Chat con el agente">
  <h2>Pregúntale al agente<small>Sobre el problema que estás viendo</small></h2>
  <div class="msgs" id="msgs"></div>
  <div class="chips" id="chips">
    <button class="chip">¿Por qué recomiendas esa?</button>
    <button class="chip">Dame otra opción</button>
    <button class="chip">¿Qué dijeron mis clientes?</button>
  </div>
  <form class="ask" id="ask">
    <input id="q" placeholder="Escribe tu pregunta" autocomplete="off" aria-label="Tu pregunta">
    <button>Enviar</button>
  </form>
</aside>
</main>

<script>
// ponytail: datos fijos de ejemplo; en el producto vienen del análisis de la IA
const problems = [
  {
    tab: "Tallas",
    title: "Tus clientes no saben qué talla pedir",
    meta: "38% de las conversaciones · Playera básica",
    desc: "Preguntan medidas antes de comprar y varios dejan de contestar después. La descripción del producto no dice cómo queda cada talla.",
    quotes: ["¿La M me queda si mido 1.70?", "¿Tallan grande o chico?"],
    options: [
      { title: "Tabla de tallas", what: "Agregar a la descripción las medidas en cm de cada talla.", why: "Responde la duda antes de que la escriban.", rec: true },
      { title: "Medidas del modelo", what: "Decir cuánto mide el modelo y qué talla usa en la foto.", why: "Ayuda a imaginar cómo le quedará." },
      { title: "Cambio de talla gratis", what: "Ofrecer un cambio sin costo si no queda.", why: "Quita el miedo a equivocarse." }
    ]
  },
  {
    tab: "Envíos",
    title: "Preguntan cuánto cuesta y cuánto tarda el envío",
    meta: "27% de las conversaciones · todos los productos",
    desc: "El costo de envío aparece hasta el final de la compra. Muchos preguntan por WhatsApp y no regresan.",
    quotes: ["¿Cuánto cobran de envío a Monterrey?", "¿En cuántos días llega?"],
    options: [
      { title: "Envío en la descripción", what: "Poner costo y días de entrega en cada producto.", why: "El cliente conoce el total desde el principio.", rec: true },
      { title: "Cupón de envío gratis", what: "Crear un cupón de envío gratis para compras desde $799.", why: "Convierte la duda en un motivo para comprar más." },
      { title: "Tiempos por zona", what: "Agregar a la descripción los días de entrega por región.", why: "Responde la segunda duda más común sobre envíos." }
    ]
  },
  {
    tab: "Confianza",
    title: "No están seguros de que la tienda sea confiable",
    meta: "18% de las conversaciones · primera compra",
    desc: "Preguntan si es seguro pagar y qué pasa si el producto no llega. La tienda no explica garantías ni devoluciones.",
    quotes: ["¿Es seguro pagar con tarjeta aquí?", "¿Y si no me llega?"],
    options: [
      { title: "Garantía visible", what: "Agregar política de devolución en 30 días a la descripción.", why: "Baja el riesgo de comprar a una tienda nueva.", rec: true },
      { title: "Métodos de pago claros", what: "Decir en la descripción qué pagos acepta y que son seguros.", why: "Responde la duda más repetida." },
      { title: "Cupón de primera compra", what: "Crear un 10% de descuento para clientes nuevos.", why: "Da un empujón para comprar por primera vez." }
    ]
  }
];

const SKIP = -1;
const picks = new Array(problems.length).fill(null); // aceptado: índice, SKIP o null
const draft = new Array(problems.length).fill(null); // seleccionado, sin aceptar
let current = 0;
const sheet = document.getElementById("sheet");
const tabs = document.getElementById("tabs");
const SUMMARY = problems.length;

function mark(i) {
  if (picks[i] === null) return "";
  return picks[i] === SKIP ? '<span class="no">–</span>' : '<span class="ok">✓</span>';
}

function renderTabs() {
  const labels = problems.map((p, i) => p.tab + mark(i));
  labels.push("Resumen");
  tabs.innerHTML = labels.map((l, i) =>
    `<button class="tab" role="tab" aria-selected="${i === current}" data-i="${i}">${l}</button>`).join("");
}

function renderProblem(i) {
  const p = problems[i];
  sheet.innerHTML = `
    <div class="meta">${p.meta}</div>
    <h1>${p.title}</h1>
    <p class="desc">${p.desc}</p>
    <div class="quotes">${p.quotes.map(q => `<span>"${q}"</span>`).join("")}</div>
    <div class="work">
      <div class="options">${p.options.map((o, j) => `
        <button class="opt" aria-pressed="${draft[i] === j}" data-j="${j}">
          <span class="badge ${o.rec ? "" : "ghost"}">Recomendada</span>
          <h3>${o.title}</h3>
          <p class="what">${o.what}</p>
          <p class="why"><b>Por qué funciona:</b> ${o.why}</p>
        </button>`).join("")}
      </div>
      <div class="actions">
        <button class="btn accept" ${draft[i] === null ? "disabled" : ""}>Aceptar</button>
        <button class="btn skip">Omitir</button>
      </div>
    </div>`;
}

function renderSummary() {
  const done = picks.every(p => p !== null);
  const changes = picks.some(p => p !== null && p !== SKIP);
  sheet.innerHTML = `
    <div class="summary">
      <div class="meta">Resumen</div>
      <h1>Cambios que se van a aplicar</h1>
      <p class="desc">Revisa tu selección. Puedes volver a cualquier hoja para cambiarla.</p>
      <ol>${problems.map((p, i) => {
        if (picks[i] === null) return `<li class="pending"><b>Sin resolver</b> · ${p.tab}</li>`;
        if (picks[i] === SKIP) return `<li><b>No hacer nada</b> · ${p.tab}</li>`;
        const o = p.options[picks[i]];
        return `<li><b>${o.title}</b> · ${p.tab}<small>${o.what}</small></li>`;
      }).join("")}</ol>
      <button class="apply" ${done && changes ? "" : "disabled"}>Aplicar en mi tienda</button>
      <p class="note">En la maqueta este botón no hace nada.</p>
    </div>`;
}

function go(i) {
  current = i;
  i === SUMMARY ? renderSummary() : renderProblem(i);
  renderTabs();
}

// siguiente hoja sin resolver (primero las de adelante), o el resumen
function next() {
  const after = picks.findIndex((p, i) => p === null && i > current);
  const any = picks.indexOf(null);
  return after !== -1 ? after : any !== -1 ? any : SUMMARY;
}

tabs.addEventListener("click", e => {
  const t = e.target.closest(".tab");
  if (t) go(+t.dataset.i);
});

sheet.addEventListener("click", e => {
  const o = e.target.closest(".opt");
  if (o) {
    const j = +o.dataset.j;
    draft[current] = draft[current] === j ? null : j; // segundo clic la quita
    return renderProblem(current);
  }
  if (e.target.closest(".accept")) picks[current] = draft[current];
  else if (e.target.closest(".skip")) { picks[current] = SKIP; draft[current] = null; }
  else return;
  go(next());
});

// ponytail: respuestas fijas de maqueta; en el producto responde la IA con el chat como contexto
const msgs = document.getElementById("msgs");
function say(text, who) {
  msgs.insertAdjacentHTML("beforeend", `<div class="msg ${who}">${text}</div>`);
  msgs.scrollTop = msgs.scrollHeight;
}
function reply(q) {
  const p = problems[Math.min(current, SUMMARY - 1)];
  const rec = p.options.find(o => o.rec);
  q = q.toLowerCase();
  if (q.includes("por qué")) return `Recomiendo "${rec.title}": ${rec.why.toLowerCase()} Es la más rápida de aplicar y no cuesta.`;
  if (q.includes("otra")) return `Otra idea: responder esta duda con un mensaje automático de bienvenida en WhatsApp. No cambia la tienda, pero ayuda mientras tanto.`;
  if (q.includes("clientes") || q.includes("dijeron")) return `Por ejemplo: ${p.quotes.map(x => `"${x}"`).join(" y ")}. ${p.meta.split(" · ")[0]}.`;
  return "En la versión real te respondo con lo que dijeron tus clientes en el chat que subiste.";
}
function ask(q) {
  if (!q.trim()) return;
  say(q.replace(/</g, "&lt;"), "me");
  setTimeout(() => say(reply(q), "bot"), 500);
}
document.getElementById("ask").addEventListener("submit", e => {
  e.preventDefault();
  const input = document.getElementById("q");
  ask(input.value);
  input.value = "";
});
document.getElementById("chips").addEventListener("click", e => {
  if (e.target.closest(".chip")) ask(e.target.textContent);
});
say("Encontré 3 problemas en tus chats. Pregúntame lo que quieras de cada uno.", "bot");

go(0);
</script>
</body>
</html>
