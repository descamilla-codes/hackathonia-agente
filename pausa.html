<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Convierte</title>
<style>
:root { --bg: #fff; --ink: #161816; --muted: #5f6661; --accent: #1f5fd6; }
@media (prefers-color-scheme: dark) { :root { --bg: #121413; --ink: #eceeec; --muted: #a2a8a4; --accent: #5b8ff0; } }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 24px 16px; box-sizing: border-box;
  background: var(--bg); color: var(--ink); font: 18px/1.5 -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
h1 { color: var(--accent); font-size: 48px; margin: 0 0 8px; }
p { color: var(--muted); margin: 0; }
</style>
</head>
<body>
<main><h1>Convierte</h1><p>Volvemos mañana.</p></main>
</body>
</html>
